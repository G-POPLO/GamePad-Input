# Dependabot version updates configuration
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # pnpm dependencies (root package.json)
  # Note: Dependabot uses the "npm" ecosystem for both npm and pnpm projects
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # ESLint and code quality tools
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "globals"
      # TypeScript and type definitions
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@types/*"
      # Build and test tooling (WXT, Vite, Vitest)
      build-tools:
        patterns:
          - "wxt"
          - "vite"
          - "vitest"
      # Remaining pnpm updates
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "globals"
          - "typescript"
          - "typescript-eslint"
          - "@types/*"
          - "wxt"
          - "vite"
          - "vitest"

  # GitHub Actions used in CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
